  <!-- Subtle developer grid — technical texture, very low opacity.
       Sits under the existing diagonal geometry; guides only, not focal. -->
  <g fill="none" stroke="#1d1d1b" stroke-width="1" opacity="0.55">
    <path d="M 160 0 L 160 1440"/>
    <path d="M 320 0 L 320 1440"/>
    <path d="M 480 0 L 480 1440"/>
    <path d="M 640 0 L 640 1440"/>
    <path d="M 800 0 L 800 1440"/>
    <path d="M 960 0 L 960 1440"/>
    <path d="M 1120 0 L 1120 1440"/>
    <path d="M 1280 0 L 1280 1440"/>
    <path d="M 1440 0 L 1440 1440"/>
    <path d="M 1600 0 L 1600 1440"/>
    <path d="M 1760 0 L 1760 1440"/>
    <path d="M 1920 0 L 1920 1440"/>
    <path d="M 2080 0 L 2080 1440"/>
    <path d="M 2240 0 L 2240 1440"/>
    <path d="M 2400 0 L 2400 1440"/>
    <path d="M 0 160 L 2560 160"/>
    <path d="M 0 320 L 2560 320"/>
    <path d="M 0 480 L 2560 480"/>
    <path d="M 0 640 L 2560 640"/>
    <path d="M 0 800 L 2560 800"/>
    <path d="M 0 960 L 2560 960"/>
    <path d="M 0 1120 L 2560 1120"/>
    <path d="M 0 1280 L 2560 1280"/>
  </g>

  <!-- Sparse registration marks — a few small crosses + dots, low opacity -->
  <g fill="none" stroke="#2c2c29" stroke-width="1.2" opacity="0.5">
    <path d="M 474 74 L 486 74 M 480 68 L 480 80"/>
    <path d="M 2074 234 L 2086 234 M 2080 228 L 2080 240"/>
    <path d="M 1274 794 L 1286 794 M 1280 788 L 1280 800"/>
    <path d="M 634 1114 L 646 1114 M 640 1108 L 640 1120"/>
    <path d="M 1914 1274 L 1926 1274 M 1920 1268 L 1920 1280"/>
  </g>
  <g fill="#2a2a27" opacity="0.5">
    <circle cx="960" cy="480" r="2"/>
    <circle cx="1600" cy="480" r="2"/>
    <circle cx="960" cy="960" r="2"/>
    <circle cx="1600" cy="960" r="2"/>
  </g>

  <!-- Large left diagonal panel — visible charcoal -->
  <g>
    <polygon points="0,0 1020,0 420,1440 0,1440" fill="#10100F"/>
    <polygon points="0,0 760,0 160,1440 0,1440" fill="#161614"/>
    <polygon points="0,240 620,0 520,0 0,200" fill="#1E1E1C"/>
  </g>

  <!-- Large right diagonal structure -->
  <g>
    <polygon points="2560,0 2560,1440 1820,1440 2420,0" fill="#10100F"/>
    <polygon points="2560,120 2560,1440 2020,1440 2500,120" fill="#161614"/>
    <polygon points="2560,1180 2140,1440 2020,1440 2560,1140" fill="#1E1E1C"/>
  </g>

  <!-- Bottom architectural wedge -->
  <g>
    <polygon points="700,1440 1750,1440 1450,1180 950,1180" fill="#0E0E0D"/>
    <polygon points="980,1440 1580,1440 1420,1260 1120,1260" fill="#161614"/>
  </g>

  <!-- Top sparse beam -->
  <g>
    <polygon points="1100,0 1680,0 1320,420 980,120" fill="#0E0E0D"/>
  </g>

  <!-- Outlines left — clearly visible dark-gray -->
  <g fill="none" stroke="#34342F" stroke-width="2" opacity="0.95">
    <path d="M -40 80 L 1060 80 L 460 1480"/>
    <path d="M -40 220 L 880 220 L 340 1480"/>
    <path d="M 0 0 L 1020 0 L 420 1440"/>
    <path d="M 760 0 L 160 1440" opacity="0.8"/>
  </g>
  <g fill="none" stroke="#2A2A27" stroke-width="1.5" opacity="0.8">
    <path d="M 120 0 L -20 480 L -20 1440"/>
  </g>

  <!-- Outlines right -->
  <g fill="none" stroke="#34342F" stroke-width="2" opacity="0.95">
    <path d="M 2600 80 L 1500 80 L 2100 1480"/>
    <path d="M 2600 240 L 1680 240 L 2220 1480"/>
    <path d="M 2560 0 L 2420 0 L 1820 1440 L 2560 1440"/>
    <path d="M 2500 120 L 2020 1440" opacity="0.8"/>
  </g>
  <g fill="none" stroke="#2A2A27" stroke-width="1.5" opacity="0.7">
    <path d="M 2440 0 L 1840 1440"/>
  </g>

  <!-- Central spine — visible on mobile crop -->
  <g fill="none" stroke="#2E2E2B" stroke-width="1.8" opacity="1">
    <path d="M 980 -40 L 1320 420 L 1120 1480"/>
    <path d="M 1240 -40 L 1540 380 L 1320 1480"/>
    <path d="M 1080 -40 L 700 1480" opacity="0.65"/>
    <path d="M 1480 -40 L 1860 1480" opacity="0.65"/>
    <path d="M 700 1180 L 1860 1180" opacity="0.6"/>
